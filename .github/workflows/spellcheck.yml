---
name: spellcheck

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install aspell
        run: |
          sudo apt-get update
          sudo apt-get install -y aspell aspell-ru
      - name: Run spellcheck
        run: ./slides/spellcheck-ru.sh
